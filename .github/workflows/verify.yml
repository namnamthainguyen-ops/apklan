name: Verify Room TN20

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-agent:
    name: Windows agent and installer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every PowerShell script using Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Verify actual Windows Server skips unsupported UWF without servicing Windows
        shell: powershell
        run: ./tests/Server-PowerOnly.ps1
      - name: Room-key derivation, authenticated state and UDP power/UWF integration tests
        run: node --test --test-concurrency=1 tests/*.test.js
      - name: Install, verify SYSTEM task and firewall, reinstall, uninstall
        shell: powershell
        run: |
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main') {
            ./tests/Install-Smoke.ps1 -IncludeOnline
          } else {
            ./tests/Install-Smoke.ps1
          }

  windows-client-setup:
    name: Single-EXE Windows client installer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact published EXE and build from source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path '.ci-client-setup/published', '.ci-client-setup/built' -Force | Out-Null
          Copy-Item -LiteralPath 'release/RoomTN20-ClientSetup-1.2.4.exe' -Destination '.ci-client-setup/published/RoomTN20-ClientSetup-1.2.4.exe'
          ./client-installer/Build.ps1 -OutputPath '.ci-client-setup/built/RoomTN20-ClientSetup-1.2.4.exe'
      - name: Verify embedded payload hashes, KDF and in-process form contract
        shell: powershell
        run: |
          ./tests/ClientInstaller-Verify.ps1 -InstallerExe '.ci-client-setup/built/RoomTN20-ClientSetup-1.2.4.exe'
          ./tests/ClientInstaller-Verify.ps1 -InstallerExe '.ci-client-setup/published/RoomTN20-ClientSetup-1.2.4.exe'
      - name: Install from single published EXE, verify SYSTEM agent, reinstall and uninstall
        shell: powershell
        run: ./tests/Install-Smoke.ps1 -InstallerExe '.ci-client-setup/published/RoomTN20-ClientSetup-1.2.4.exe'
      - name: Record installer checksums
        shell: powershell
        run: |
          Get-ChildItem '.ci-client-setup' -Recurse -Filter '*.exe' | Get-FileHash -Algorithm SHA256 | Format-List | Out-File '.ci-client-setup/SHA256.txt'
      - name: Upload tested installer EXEs
        uses: actions/upload-artifact@v4
        with:
          name: RoomTN20-ClientSetup-tested
          path: .ci-client-setup/
          include-hidden-files: true
          if-no-files-found: error

  android:
    name: Android build, tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android integration harness syntax
        run: |
          python3 -m py_compile tests/mock-lan-agent.py tests/android-ui-smoke.py tests/android-release-smoke.py
          bash -n tests/android-launch.sh
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install matching Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, Android lint and APK build
        working-directory: android-app
        run: gradle --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Verify published release signature and reject debug builds
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/RoomTN20-1.2.3.apk | tee published-apk-signature.txt
          grep -q '253e62e567d191b4481aaae2cd087610e1ca730b76e5cf19ec4e97165fa22b5a' published-apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/RoomTN20-1.2.3.apk > published-apk-badging.txt
          grep -q "versionCode='8' versionName='1.2.3'" published-apk-badging.txt
          if grep -q 'application-debuggable' published-apk-badging.txt; then exit 1; fi
      - name: APK checksum
        run: sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomTN20-debug
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/reports/lint-results-debug.*
            android-app/app/build/reports/lint-results-release.*

  android-launch:
    name: Android emulator API ${{ matrix.api }}
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RoomTN20-debug
          path: tested-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Room discovery, offline persistence, bulk power/UWF and APK upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/android-launch.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-api-${{ matrix.api }}
          path: emulator-evidence/
